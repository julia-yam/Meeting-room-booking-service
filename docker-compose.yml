version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: booking_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: my_secret_password_123
      POSTGRES_DB: booking_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: booking_web
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DATABASE_URL=postgresql+asyncpg://postgres:my_secret_password_123@db:5432/booking_db
    command: sh -c "uvicorn src.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data: